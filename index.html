<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=chat_bubble,dashboard,groups,help_center,home,person,schedule,settings,shield_person,task"
    />
    <title>Odin Dashboard</title>
  </head>
  <body>
    <div class="header">
      <div class="top">
        <div class="left">
          <img
            src="src/magnify.svg"
            alt="search logo"
            id="search-logo"
            class="logo"
          />
          <input type="text" placeholder="Search" id="search" />
        </div>

        <div class="right">
          <img
            src="src/bell-ring-outline.svg"
            alt="notify logo"
            id="notif-logo"
            class="logo"
          />
          <img
            src="src/main-profile.png"
            class="profile-picture"
            id="main-top-right"
            alt="Main Profile Picture for Account"
          />
          <h6>Morgan Oakley</h6>
        </div>
      </div>
      <div class="bottom">
        <div class="left">
          <img
            src="src/main-profile.png"
            class="profile-picture"
            id="main-hero"
            alt="Hello Main Profile Picture"
          />
          <div class="welcome-text">
            <p id="welcome-message">Hi there,</p>
            <h5 id="welcome-hero-name">Morgan Oakley (@morgan)</h5>
          </div>
        </div>

        <div class="right">
          <button class="header-actions">New</button>
          <button class="header-actions">Upload</button>
          <button class="header-actions">Share</button>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <div class="logo-section">
        <span class="material-symbols-outlined">dashboard</span>
        <h4>Dashboard</h4>
      </div>
      <div class="line-break"></div>
      <ul class="main-section">
        <li>
          <span class="material-symbols-outlined">home</span>
          <h6>Home</h6>
        </li>
        <li>
          <span class="material-symbols-outlined">person</span>
          <h6>Profile</h6>
        </li>
        <li>
          <span class="material-symbols-outlined">chat_bubble</span>
          <h6>Messages</h6>
        </li>
        <li>
          <span class="material-symbols-outlined">schedule</span>
          <h6>History</h6>
        </li>
        <li>
          <span class="material-symbols-outlined">task</span>
          <h6>Tasks</h6>
        </li>
        <li>
          <span class="material-symbols-outlined">groups</span>
          <h6>Communities</h6>
        </li>
      </ul>
      <div class="line-break"></div>
      <ul class="others-section">
        <li>
          <span class="material-symbols-outlined">settings</span>
          <h6>Settings</h6>
        </li>
        <li>
           <span class="material-symbols-outlined">help_center</span>
          <h6>Support</h6>
        </li>
        <li>
           <span class="material-symbols-outlined">shield_person</span>
          <h6>Privacy</h6>
        </li>
      </ul>
      </ul>
    </div>
    <div class="main"></div>
  </body>
</html>
